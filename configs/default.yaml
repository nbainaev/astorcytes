experiment_name: "default"
baseline_mode: plausible

learning:
  enable_stdp: true

grid_size: 5
start_position: 4
goal_position: 6
n_steps: 50

neuron:
  learning_rate: 1
  wmin: 0.001
  wmax: 1
  weight_decay: 0
  post_spike_weight_decay: 0.005
  reset: 0
  refrac: 40
  thresh: 7

astrocyte:
  enable: true
  alpha: 0.001
  k: 0.2

reinforce:
  enable: true
  learning_rate: 0.01
  temperature: 1.0
  reward_goal: 10.0
  step_penalty: -0.1
  gamma: 0.99
  baseline_decay: 0.01
  policy_mix_beta: 0.0
  trace_decay: 0.95
  surrogate:
    type: "lif"

simulation:
  input_mode: paper_bernoulli
  # Expected Bernoulli candidate events per 1-s window; with dt=1 ms this is p=0.15.
  # Input's source-faithful 40-ms refractory gate limits accepted X spikes afterward.
  intensity: 150.0
  time_steps: 1000
  dt: 1

experiment:
  num_experiments: 3
  seeds: [42, 223, 1337]  # Fixed third seed keeps all configured experiments reproducible.
  num_cycles: 2

output_dir: "results"
logger_type: "file"
runtime:
  torch_num_threads: 1
comet:
  workspace: null
  project_name: null
