experiment_name: "astrocytes"

grid_size: 5
start_position: 12
goal_position: 24
n_steps: 50

neuron:
  learning_rate: 1
  wmin: 0.001
  wmax: 1
  weight_decay: 0
  post_spike_weight_decay: 0.005
  reset: 0
  refrac: 40
  thresh: 7

astrocyte:
  enable: false
  alpha: 0.001
  k: 0.2

learning:
  enable_stdp: true

simulation:
  # Expected Bernoulli candidate events per 1-s window; with dt=1 ms this is p=0.15.
  intensity: 150.0
  time_steps: 1000
  dt: 1

reinforce:
  enable: true
  learning_rate: 1.0
  temperature: 1.0
  reward_goal: 1.0
  step_penalty: -0.01
  gamma: 0.99
  baseline_decay: 0.01
  # control influence of weights vs spikes for softmax
  # this is also reinforce gradient scale (0 means no gradient)
  policy_mix_beta: 0.0  # 1.0 - weights, 0.0 - spikes
  trace_decay: 0.99

experiment:
  num_experiments: 3
  seeds: [111, 231, 5433]
  num_cycles: 50

output_dir: "results"
runtime:
  torch_num_threads: 1

comet:
  workspace: zhekahauska
  project_name: astrocytes
