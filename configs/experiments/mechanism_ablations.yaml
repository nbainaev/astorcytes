# Eight-cell STDP x REINFORCE x astrocyte factorial.
# Source-faithful input is the notebook's static positive 0.015 drive, filtered
# by the 40-ms Input refractory gate. Frozen evaluations use both astro modes.
max_parallel: 32
schedule: interleaved
experiments:
  - name: stdp0_rl0_astro0
    command: .venv/bin/python -m astrocites.run
    base_config: configs/diagnostics/main_reference.yaml
    logger: file
    output_dir: results/mechanism_ablations/stdp0_rl0_astro0/logs
    overrides:
      grid_size: 5
      start_position: 4
      goal_position: 6
      n_steps: 50
      astrocyte.enable: false
      reinforce.enable: false
      learning.baseline_mode: main_reference
      learning.enable_stdp: false
      learning.main_selected_action_stdp_gain: 1.5
      protocol.initial_baseline_stdp: false
      protocol.legacy_verification_stdp: false
      protocol.run_legacy_verification: false
      diagnostics.enable: true
      diagnostics.output_dir: results/mechanism_ablations/stdp0_rl0_astro0/diagnostics
      diagnostics.evaluation_rollouts: 20
      diagnostics.evaluation_checkpoints: [50]
      diagnostics.evaluation_astrocyte_modes: [false, true]
      experiment.num_experiments: 1
      experiment.num_cycles: 50
      simulation.intensity: 15.0
      simulation.input_mode: legacy_static_positive
      simulation.input_probability: null
      simulation.input_refractory: 40
    grid:
      experiment.seeds:
      - [1000]
      - [1001]
      - [1002]
      - [1003]
      - [1004]
      - [1005]
    max_parallel: 4

