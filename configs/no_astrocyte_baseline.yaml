experiment_name: "no_astrocyte_baseline"

grid_size: 3
start_position: 4
goal_position: 6
n_steps: 101

neuron:
  learning_rate: 1
  wmin: 0.001
  wmax: 1
  weight_decay: 0
  post_spike_weight_decay: 0.005
  reset: 0
  refrac: 40
  thresh: 7

astrocyte:
  enable: false
  alpha: 0.001
  k: 0.2

learning:
  enable_stdp: true

simulation:
  # Expected Bernoulli candidate events per 1-s window; with dt=1 ms this is p=0.15.
  intensity: 150.0
  time_steps: 1000
  dt: 1

experiment:
  num_experiments: 5
  num_cycles: 20

output_dir: "results_no_astro"
logger_type: "file"
runtime:
  torch_num_threads: 1
comet:
  workspace: null
  project_name: null
